document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

adow:0 30px 90px rgba(38,34,29,.14)\">\n\n  <!-- ============ COVER ============ -->\n  <section style=\"position:relative;overflow:hidden;padding:96px 88px 84px;background:radial-gradient(120% 100% at 12% 0%,#F7F1E6 0%,#F1E8D6 60%,#EADFC8 100%)\">\n    <div style=\"position:absolute;width:340px;height:340px;border-radius:50%;border:1.5px solid rgba(184,92,56,.28);top:-70px;right:60px;animation:drift 11s ease-in-out infinite\"><\u002Fdiv>\n    <div style=\"position:absolute;width:210px;height:210px;border-radius:50%;border:1.5px solid rgba(110,125,91,.32);top:120px;right:250px;animation:drift 14s ease-in-out infinite\"><\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;gap:15px;margin-bottom:70px\">\n      <div style=\"width:44px;height:44px;border-radius:50%;background:#B85C38;box-shadow:inset 0 0 0 4px #F5EFE3, inset 0 0 0 6px #B85C38\"><\u002Fdiv>\n      <span style=\"font-family:'Spectral',serif;font-weight:600;font-size:27px;letter-spacing:-.01em\">Claire Packs<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#B85C38;margin-bottom:26px\"><span style=\"width:26px;height:1.5px;background:#B85C38\"><\u002Fspan>Brand &amp; Design System · v1.0<\u002Fdiv>\n    <h1 style=\"font-family:'Spectral',serif;font-weight:400;font-size:82px;line-height:1.0;letter-spacing:-.025em;margin:0 0 26px;max-width:820px\">Care, packed<br>with intention.<\u002Fh1>\n    <p style=\"font-size:19px;line-height:1.6;color:#524b42;max-width:560px;margin:0\">The complete visual language for Claire Packs — colours, type, logo, iconography, patterns and print-ready applications. Built for use in Canva across packaging, stickers, flyers and social.<\u002Fp>\n    <div style=\"position:relative;display:flex;gap:10px;margin-top:56px\">\n      <span style=\"width:46px;height:46px;border-radius:10px;background:#B85C38\"><\u002Fspan>\n      <span style=\"width:46px;height:46px;border-radius:10px;background:#6E7D5B\"><\u002Fspan>\n      <span style=\"width:46px;height:46px;border-radius:10px;background:#C6905E\"><\u002Fspan>\n      <span style=\"width:46px;height:46px;border-radius:10px;background:#26221D\"><\u002Fspan>\n      <span style=\"width:46px;height:46px;border-radius:10px;background:#EFE7D6;border:1px solid rgba(38,34,29,.12)\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ CONTENTS ============ -->\n  <section style=\"padding:52px 88px;background:#26221D;color:#F5EFE3\">\n    <div style=\"display:flex;gap:60px;flex-wrap:wrap\">\n      <div style=\"font-family:'Spectral',serif;font-style:italic;font-size:21px;color:#D89468;min-width:200px\">In this system<\u002Fdiv>\n      <div style=\"flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:20px 40px;font-size:15px\">\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Spectral',serif;color:#D89468\">01<\u002Fspan>Brand &amp; voice<\u002Fdiv>\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Spectral',serif;color:#D89468\">02<\u002Fspan>Logo<\u002Fdiv>\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Spectral',serif;color:#D89468\">03<\u002Fspan>Colour<\u002Fdiv>\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Spectral',serif;color:#D89468\">04<\u002Fspan>Typography<\u002Fdiv>\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Spectral',serif;color:#D89468\">05<\u002Fspan>Iconography<\u002Fdiv>\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Spectral',serif;color:#D89468\">06<\u002Fspan>Patterns &amp; texture<\u002Fdiv>\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Spectral',serif;color:#D89468\">07<\u002Fspan>Applications<\u002Fdiv>\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Spectral',serif;color:#D89468\">08<\u002Fspan>Canva quick-start<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 01 BRAND ============ -->\n  <section style=\"padding:78px 88px 64px\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:14px\"><span style=\"font-family:'Spectral',serif;font-size:15px;color:#B85C38\">01<\u002Fspan><span style=\"font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#B85C38\">Brand &amp; voice<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:44px;letter-spacing:-.02em;line-height:1.08;margin:0 0 20px;max-width:720px\">Warm, human, and quietly hopeful.<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#524b42;max-width:620px;margin:0 0 44px\">Claire Packs makes thoughtful care packs for people in drug &amp; alcohol recovery, tailored to where they are in the journey. Everything we make should feel like it was handed over by a person who cares — never clinical, never corporate.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:48px\">\n      <div style=\"background:#fff;border:1px solid rgba(38,34,29,.09);border-radius:14px;padding:28px\">\n        <div style=\"font-family:'Spectral',serif;font-size:22px;font-weight:600;margin-bottom:8px\">Tender<\u002Fdiv>\n        <p style=\"font-size:14.5px;line-height:1.6;color:#524b42;margin:0\">Speak gently and directly to a person having a hard day. Soft, plain language over jargon.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid rgba(38,34,29,.09);border-radius:14px;padding:28px\">\n        <div style=\"font-family:'Spectral',serif;font-size:22px;font-weight:600;margin-bottom:8px\">Grounded<\u002Fdiv>\n        <p style=\"font-size:14.5px;line-height:1.6;color:#524b42;margin:0\">Practical and honest. We say what's in the pack and why it matters. No hype, no false promises.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid rgba(38,34,29,.09);border-radius:14px;padding:28px\">\n        <div style=\"font-family:'Spectral',serif;font-size:22px;font-weight:600;margin-bottom:8px\">Hopeful<\u002Fdiv>\n        <p style=\"font-size:14.5px;line-height:1.6;color:#524b42;margin:0\">Every message leans toward the next step forward — a literal, hopeful bit of growth.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px\">\n      <div style=\"background:#EDF0E5;border:1px solid rgba(110,125,91,.3);border-radius:14px;padding:28px 30px\">\n        <div style=\"display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5a6a49;margin-bottom:16px\"><span style=\"width:20px;height:20px;border-radius:50%;background:#6E7D5B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px\">✓<\u002Fspan>We say<\u002Fdiv>\n        <ul style=\"list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px;font-size:15px;line-height:1.5;color:#3f4a33\">\n          <li>\"Care, packed with intention.\"<\u002Fli>\n          <li>\"For the first hard days, when everything feels overwhelming.\"<\u002Fli>\n          <li>\"You're cared for here.\"<\u002Fli>\n          <li>\"A real person, not a portal.\"<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#F6E7E0;border:1px solid rgba(184,92,56,.28);border-radius:14px;padding:28px 30px\">\n        <div style=\"display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a24e2e;margin-bottom:16px\"><span style=\"width:20px;height:20px;border-radius:50%;background:#B85C38;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px\">✕<\u002Fspan>We avoid<\u002Fdiv>\n        <ul style=\"list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px;font-size:15px;line-height:1.5;color:#7c4a37\">\n          <li>Clinical or bureaucratic phrasing<\u002Fli>\n          <li>Pity, shame, or \"before &amp; after\" framing<\u002Fli>\n          <li>Loud sales language &amp; exclamation marks<\u002Fli>\n          <li>Emoji, slang, or forced cheerfulness<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 02 LOGO ============ -->\n  <section style=\"padding:64px 88px;background:#EFE7D6;border-top:1px solid rgba(38,34,29,.1);border-bottom:1px solid rgba(38,34,29,.1)\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:14px\"><span style=\"font-family:'Spectral',serif;font-size:15px;color:#B85C38\">02<\u002Fspan><span style=\"font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#B85C38\">Logo<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:44px;letter-spacing:-.02em;margin:0 0 8px\">The mark &amp; wordmark<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#524b42;max-width:600px;margin:0 0 40px\">A concentric ring — a pebble, a ripple, a moment of calm. Paired with the wordmark set in Spectral SemiBold.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-bottom:22px\">\n      <div style=\"background:#F5EFE3;border-radius:16px;padding:56px;display:flex;align-items:center;justify-content:center;gap:18px;border:1px solid rgba(38,34,29,.08)\">\n        <div style=\"width:64px;height:64px;border-radius:50%;background:#B85C38;box-shadow:inset 0 0 0 6px #F5EFE3, inset 0 0 0 9px #B85C38\"><\u002Fdiv>\n        <span style=\"font-family:'Spectral',serif;font-weight:600;font-size:40px;letter-spacing:-.01em\">Claire Packs<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#F5EFE3;border-radius:16px;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;border:1px solid rgba(38,34,29,.08)\">\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7a7268\">Icon only<\u002Fdiv>\n        <div style=\"width:78px;height:78px;border-radius:50%;background:#B85C38;box-shadow:inset 0 0 0 7px #F5EFE3, inset 0 0 0 11px #B85C38\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n      <div style=\"background:#26221D;border-radius:14px;padding:34px;display:flex;flex-direction:column;align-items:center;gap:16px\">\n        <div style=\"width:48px;height:48px;border-radius:50%;background:#F5EFE3;box-shadow:inset 0 0 0 5px #26221D, inset 0 0 0 7px #F5EFE3\"><\u002Fdiv>\n        <span style=\"font-family:'Spectral',serif;font-weight:600;font-size:16px;color:#F5EFE3\">On ink<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#6E7D5B;border-radius:14px;padding:34px;display:flex;flex-direction:column;align-items:center;gap:16px\">\n        <div style=\"width:48px;height:48px;border-radius:50%;background:#F5EFE3;box-shadow:inset 0 0 0 5px #6E7D5B, inset 0 0 0 7px #F5EFE3\"><\u002Fdiv>\n        <span style=\"font-family:'Spectral',serif;font-weight:600;font-size:16px;color:#F5EFE3\">On sage<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#B85C38;border-radius:14px;padding:34px;display:flex;flex-direction:column;align-items:center;gap:16px\">\n        <div style=\"width:48px;height:48px;border-radius:50%;background:#F5EFE3;box-shadow:inset 0 0 0 5px #B85C38, inset 0 0 0 7px #F5EFE3\"><\u002Fdiv>\n        <span style=\"font-family:'Spectral',serif;font-weight:600;font-size:16px;color:#F5EFE3\">On terracotta<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#F5EFE3;border:1px solid rgba(38,34,29,.12);border-radius:14px;padding:34px;display:flex;flex-direction:column;align-items:center;gap:16px\">\n        <div style=\"width:48px;height:48px;border-radius:50%;background:#26221D;box-shadow:inset 0 0 0 5px #F5EFE3, inset 0 0 0 7px #26221D\"><\u002Fdiv>\n        <span style=\"font-family:'Spectral',serif;font-weight:600;font-size:16px;color:#26221D\">Mono / 1-colour<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px\">\n      <div style=\"background:#EDF0E5;border-radius:14px;padding:26px 28px\">\n        <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5a6a49;margin-bottom:14px\">Do<\u002Fdiv>\n        <ul style=\"list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;font-size:14.5px;line-height:1.5;color:#3f4a33\">\n          <li>· Keep clear space of one ring-width on all sides<\u002Fli>\n          <li>· Use the mark solo at small sizes (favicon, sticker seal)<\u002Fli>\n          <li>· Minimum wordmark width: 96px screen / 22mm print<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#F6E7E0;border-radius:14px;padding:26px 28px\">\n        <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a24e2e;margin-bottom:14px\">Don't<\u002Fdiv>\n        <ul style=\"list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;font-size:14.5px;line-height:1.5;color:#7c4a37\">\n          <li>· Recolour the wordmark in off-brand hues<\u002Fli>\n          <li>· Stretch, rotate, or add drop shadows<\u002Fli>\n          <li>· Swap Spectral for another serif<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 03 COLOUR ============ -->\n  <section style=\"padding:78px 88px 64px\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:14px\"><span style=\"font-family:'Spectral',serif;font-size:15px;color:#B85C38\">03<\u002Fspan><span style=\"font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#B85C38\">Colour<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:44px;letter-spacing:-.02em;margin:0 0 8px\">A warm, earthy palette<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#524b42;max-width:640px;margin:0 0 40px\">Terracotta leads, ink grounds, cream breathes. Sage and clay carry the three pack stages. Print values are approximate CMYK — always proof before a production run.<\u002Fp>\n\n    <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7a7268;margin-bottom:16px\">Core<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:40px\">\n      <div style=\"border-radius:14px;overflow:hidden;border:1px solid rgba(38,34,29,.09)\">\n        <div style=\"height:132px;background:#B85C38\"><\u002Fdiv>\n        <div style=\"padding:18px 20px;background:#fff\">\n          <div style=\"font-family:'Spectral',serif;font-size:19px;font-weight:600;margin-bottom:6px\">Terracotta<\u002Fdiv>\n          <div style=\"font-size:13px;color:#524b42;line-height:1.7\">HEX #B85C38<br>RGB 184 · 92 · 56<br>CMYK 0 · 50 · 70 · 28<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#7a7268;margin-top:8px\">Primary accent · CTAs · headlines<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:14px;overflow:hidden;border:1px solid rgba(38,34,29,.09)\">\n        <div style=\"height:132px;background:#26221D\"><\u002Fdiv>\n        <div style=\"padding:18px 20px;background:#fff\">\n          <div style=\"font-family:'Spectral',serif;font-size:19px;font-weight:600;margin-bottom:6px\">Ink<\u002Fdiv>\n          <div style=\"font-size:13px;color:#524b42;line-height:1.7\">HEX #26221D<br>RGB 38 · 34 · 29<br>CMYK 0 · 11 · 24 · 85<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#7a7268;margin-top:8px\">Text · dark bands · footer<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:14px;overflow:hidden;border:1px solid rgba(38,34,29,.09)\">\n        <div style=\"height:132px;background:#F5EFE3\"><\u002Fdiv>\n        <div style=\"padding:18px 20px;background:#fff\">\n          <div style=\"font-family:'Spectral',serif;font-size:19px;font-weight:600;margin-bottom:6px\">Cream / Paper<\u002Fdiv>\n          <div style=\"font-size:13px;color:#524b42;line-height:1.7\">HEX #F5EFE3<br>RGB 245 · 239 · 227<br>CMYK 0 · 2 · 7 · 4<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#7a7268;margin-top:8px\">Primary background<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7a7268;margin-bottom:16px\">Pack stages<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:40px\">\n      <div style=\"border-radius:14px;overflow:hidden;border:1px solid rgba(38,34,29,.09)\">\n        <div style=\"height:100px;background:linear-gradient(150deg,#E4B58C,#C97a54);display:flex;align-items:flex-end;padding:14px\"><span style=\"font-family:'Spectral',serif;font-size:30px;font-weight:600;color:rgba(255,255,255,.85)\">01<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:16px 20px;background:#fff\">\n          <div style=\"font-family:'Spectral',serif;font-size:18px;font-weight:600\">Welcome · terracotta<\u002Fdiv>\n          <div style=\"font-size:13px;color:#524b42;line-height:1.7;margin-top:5px\">#B85C38 → #E4B58C<br>On-arrival pack<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:14px;overflow:hidden;border:1px solid rgba(38,34,29,.09)\">\n        <div style=\"height:100px;background:linear-gradient(150deg,#9FB07F,#6E7D5B);display:flex;align-items:flex-end;padding:14px\"><span style=\"font-family:'Spectral',serif;font-size:30px;font-weight:600;color:rgba(255,255,255,.85)\">02<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:16px 20px;background:#fff\">\n \"><\u002Fdiv><div style=\"font-size:12px;color:#524b42;margin-top:8px;line-height:1.5\">Muted<br>#7A7268<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:74px;border-radius:11px;background:#D89468\"><\u002Fdiv><div style=\"font-size:12px;color:#524b42;margin-top:8px;line-height:1.5\">Peach<br>#D89468<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"height:74px;border-radius:11px;background:#b8afa2\"><\u002Fdiv><div style=\"font-size:12px;color:#524b42;margin-top:8px;line-height:1.5\">Stone<br>#B8AFA2<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 04 TYPOGRAPHY ============ -->\n  <section style=\"padding:64px 88px;background:#26221D;color:#F5EFE3\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:14px\"><span style=\"font-family:'Spectral',serif;font-size:15px;color:#D89468\">04<\u002Fspan><span style=\"font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#D89468\">Typography<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:44px;letter-spacing:-.02em;margin:0 0 40px\">Two typefaces, clear roles<\u002Fh2>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:34px\">\n      <div style=\"background:rgba(245,239,227,.06);border:1px solid rgba(245,239,227,.14);border-radius:16px;padding:34px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px\"><span style=\"font-family:'Spectral',serif;font-size:26px;font-weight:600\">Spectral<\u002Fspan><span style=\"font-size:12.5px;color:#b8afa2\">Display · serif<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:'Spectral',serif;font-size:58px;line-height:1;margin-bottom:14px\">Aa<\u002Fdiv>\n        <div style=\"font-family:'Spectral',serif;font-size:18px;line-height:1.5;color:#e8e0d2\">Light 300 · Regular 400 · <span style=\"font-weight:500\">Medium 500<\u002Fspan> · <span style=\"font-weight:600\">SemiBold 600<\u002Fspan> · <i>Italic<\u002Fi><\u002Fdiv>\n        <p style=\"font-size:14px;color:#b8afa2;margin:18px 0 0;line-height:1.6\">Headlines, the wordmark, stat numerals, and pull-quotes. Set tight: letter-spacing −0.02em, line-height 1.0–1.1.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(245,239,227,.06);border:1px solid rgba(245,239,227,.14);border-radius:16px;padding:34px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px\"><span style=\"font-family:'Public Sans';font-size:26px;font-weight:600\">Public Sans<\u002Fspan><span style=\"font-size:12.5px;color:#b8afa2\">Body · sans<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:58px;line-height:1;margin-bottom:14px;font-weight:600\">Aa<\u002Fdiv>\n        <div style=\"font-size:18px;line-height:1.5;color:#e8e0d2\">Regular 400 · <span style=\"font-weight:500\">Medium 500<\u002Fspan> · <span style=\"font-weight:600\">SemiBold 600<\u002Fspan> · <span style=\"font-weight:700\">Bold 700<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:14px;color:#b8afa2;margin:18px 0 0;line-height:1.6\">Body copy, labels, buttons, and eyebrows. Eyebrows: uppercase, 600–700, letter-spacing +0.1em.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:rgba(245,239,227,.06);border:1px solid rgba(245,239,227,.14);border-radius:16px;padding:34px 38px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"display:flex;align-items:baseline;gap:24px;border-bottom:1px solid rgba(245,239,227,.12);padding-bottom:18px\"><span style=\"width:120px;font-size:12px;color:#b8afa2;flex:none\">H1 · Display<\u002Fspan><span style=\"font-family:'Spectral',serif;font-weight:400;font-size:46px;letter-spacing:-.02em;line-height:1\">Care, packed with intention.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:24px;border-bottom:1px solid rgba(245,239,227,.12);padding-bottom:18px\"><span style=\"width:120px;font-size:12px;color:#b8afa2;flex:none\">H2 · Section<\u002Fspan><span style=\"font-family:'Spectral',serif;font-weight:500;font-size:32px;letter-spacing:-.02em\">Three packs, one journey<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:24px;border-bottom:1px solid rgba(245,239,227,.12);padding-bottom:18px\"><span style=\"width:120px;font-size:12px;color:#b8afa2;flex:none\">Eyebrow<\u002Fspan><span style=\"font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#D89468\">On arrival<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:24px\"><span style=\"width:120px;font-size:12px;color:#b8afa2;flex:none\">Body<\u002Fspan><span style=\"font-size:16px;line-height:1.6;color:#e8e0d2;max-width:560px\">Thoughtful care packs for people in recovery — tailored to exactly where they are in the journey.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:14px;color:#D89468;margin:22px 0 0;font-family:'Spectral',serif;font-style:italic\">Both Spectral and Public Sans are free Google Fonts and available directly inside Canva.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============ 05 ICONOGRAPHY ============ -->\n  <section style=\"padding:78px 88px 64px\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:14px\"><span style=\"font-family:'Spectral',serif;font-size:15px;color:#B85C38\">05<\u002Fspan><span style=\"font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#B85C38\">Iconography<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:44px;letter-spacing:-.02em;margin:0 0 8px\">Soft line icons<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#524b42;max-width:640px;margin:0 0 40px\">Single-weight strokes, generously rounded caps and joins, drawn on a circle. Warm and calm — never sharp or technical. Stroke 2px, rounded ends, ink or terracotta.<\u002Fp>\n\n    <div st nt-family:'Spectral',serif;font-weight:400;font-size:30px;line-height:1.12;color:#F5EFE3\">Care, packed with intention.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:.85fr 1.15fr;gap:26px\">\n      <!-- PACKAGING BOX -->\n      <div>\n        <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7a7268;margin-bottom:14px\">Packaging · box face<\u002Fdiv>\n        <div style=\"border-radius:16px;overflow:hidden;border:1px solid rgba(38,34,29,.09);background:#FBF8F1\">\n          <div style=\"background:linear-gradient(150deg,#E4B58C,#C97a54);padding:26px 28px;color:#F5EFE3\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:34px\">\n              <div style=\"width:26px;height:26px;border-radius:50%;background:#F5EFE3;box-shadow:inset 0 0 0 3px #C97a54,inset 0 0 0 4px #F5EFE3\"><\u002Fdiv>\n              <span style=\"font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9\">Pack 01 · On arrival<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family:'Spectral',serif;font-size:42px;font-weight:600;line-height:1\">Welcome<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:22px 28px 26px\">\n            <p style=\"font-size:14px;line-height:1.6;color:#524b42;margin:0 0 14px\">For the first hard days, when everything feels overwhelming.<\u002Fp>\n            <p style=\"font-size:12.5px;line-height:1.55;color:#7a7268;margin:0\">Unscented toiletries · a breathing card · a pebble etched with one word: <i style=\"font-family:'Spectral',serif\">start<\u002Fi>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- FLYER -->\n      <div>\n        <div style=\"font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7a7268;margin-bottom:14px\">Flyer · A5 for centres<\u002Fdiv>\n        <div style=\"border-radius:16px;overflow:hidden;border:1px solid rgba(38,34,29,.09);background:#F5EFE3;display:grid;grid-template-columns:1fr 1fr\">\n          <div style=\"padding:30px 30px 26px\">\n            <div style=\"display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#B85C38;margin-bottom:16px\"><span style=\"width:18px;height:1.5px;background:#B85C38\"><\u002Fspan>Free 6-month trial<\u002Fdiv>\n            <div style=\"font-family:'Spectral',serif;font-weight:500;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin-bottom:14px\">Bring Claire Packs to your centre.<\u002Fdiv>\n            <p style=\"font-size:13px;line-height:1.6;color:#524b42;margin:0 0 18px\">Thoughtful care packs for every stage of recovery — no cost, no commitment.<\u002Fp>\n            <span style=\"display:inline-block;background:#B85C38;color:#fff;padding:11px 20px;border-radius:100px;font-weight:600;font-size:13px\">Start your free trial →<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:radial-gradient(120% 120% at 25% 10%,#9FB07F,#6E7D5B 65%,#556046);position:relative\">\n            <div style=\"position:absolute;width:110px;height:110px;border-radius:50%;border:1.5px solid rgba(246,239,227,.4);top:30px;left:24px\"><\u002Fdiv>\n            <span style=\"position:absolute;left:24px;bottom:22px;color:#F5EFE3;font-family:'Spectral',serif;font-style:italic;font-size:15px\">Made in honour<br>of Claire.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 08 CANVA QUICK-START ============ -->\n  <section style=\"padding:64px 88px 78px;background:#26221D;color:#F5EFE3\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:14px\"><span style=\"font-family:'Spectral',serif;font-size:15px;color:#D89468\">08<\u002Fspan><span style=\"font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#D89468\">Canva quick-start<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:44px;letter-spacing:-.02em;margin:0 0 36px\">Set it up once<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px\">\n      <div style=\"background:rgba(245,239,227,.06);border:1px solid rgba(245,239,227,.14);border-radius:14px;padding:28px\">\n        <div style=\"font-family:'Spectral',serif;font-size:20px;color:#D89468;margin-bottom:12px\">01<\u002Fdiv>\n        <h3 style=\"font-family:'Spectral',serif;font-weight:600;font-size:19px;margin:0 0 8px\">Add a Brand Kit<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.6;color:#c9c0b3;margin:0\">Paste the six core hex codes into Canva → Brand → Colours. Set Spectral as heading font, Public Sans as body.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(245,239,227,.06);border:1px solid rgba(245,239,227,.14);border-radius:14px;padding:28px\">\n        <div style=\"font-family:'Spectral',serif;font-size:20px;color:#D89468;margin-bottom:12px\">02<\u002Fdiv>\n        <h3 style=\"font-family:'Spectral',serif;font-weight:600;font-size:19px;margin:0 0 8px\">Colour-code by pack<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.6;color:#c9c0b3;margin:0\">Terracotta = Welcome, Sage = Steady, Clay = Onward. Keep each pack's materials in its own colour.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(245,239,227,.06);border:1px solid rgba(245,239,227,.14);border-radius:14px;padding:28px\">\n        <div style=\"font-family:'Spectral',serif;font-size:20px;color:#D89468;margin-bottom:12px\">03<\u002Fdiv>\n        <h3 style=\"font-family:'Spectral',serif;font-weight:600;font-size:19px;margin:0 0 8px\">Print safe<\u002Fh3>\n        <p style=\"font-size:14px;line-height:1.6;color:#c9c0b3;margin:0\">Export PDF Print with crop marks &amp; bleed. Use CMYK values above and order a proof before big runs.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:44px;padding-top:28px;border-top:1px solid rgba(245,239,227,.14);display:flex;align-items:center;gap:14px\">\n      <div style=\"width:30px;height:30px;border-radius:50%;background:#B85C38;box-shadow:inset 0 0 0 3px #26221D,inset 0 0 0 4px #B85C38\"><\u002Fdiv>\n      <span style=\"font-family:'Spectral',serif;font-weight:600;font-size:19px\">Claire Packs<\u002Fspan>\n      <span style=\"font-family:'Spectral',serif;font-style:italic;font-size:15px;color:#D89468;margin-left:8px\">Care, packed with intention.<\u002Fspan>\n      <span style=\"margin-left:auto;font-size:13px;color:#8f887c\">Brand &amp; Design System · v1.0<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
